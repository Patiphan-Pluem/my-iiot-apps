# -----------------------------------------------------------------
# 1. การตั้งค่า MQTT (ConfigMap)
# -----------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: default
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    # เปิด Port 1883 ให้คนอื่นเข้ามาได้
    listener 1883
    allow_anonymous true

---
# -----------------------------------------------------------------
# 2. MQTT Broker (DaemonSet)
# -----------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mqtt-edge-broker
  namespace: default
spec:
  selector:
    matchLabels:
      app: mqtt-edge
  template:
    metadata:
      labels:
        app: mqtt-edge
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      # ⭐️ บังคับให้รันบน Edge Node เท่านั้น
      nodeSelector:
        node-type: edge
      hostNetwork: true
      
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          hostPort: 1883 # เปิด Port จริงบนเครื่อง Edge
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: data
          mountPath: /mosquitto/data

      volumes:
      - name: config
        configMap:
          name: mqtt-config
      - name: data
        hostPath:
          # เก็บข้อมูล MQTT ลงบนเครื่อง Edge จริงๆ (กันข้อมูลหายเมื่อ Pod ตาย)
          path: /var/lib/edge-mqtt-data
          type: DirectoryOrCreate

---
# -----------------------------------------------------------------
# 3. TimescaleDB (DaemonSet)
# -----------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: timescaledb-edge
  namespace: default
spec:
  selector:
    matchLabels:
      app: timescaledb-edge
  template:
    metadata:
      labels:
        app: timescaledb-edge
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      # ⭐️ บังคับให้รันบน Edge Node เท่านั้น
      nodeSelector:
        node-type: edge
      hostNetwork: true
      
      containers:
      - name: timescaledb
        # ใช้ Image ของ TimescaleDB (Based on PostgreSQL 14)
        image: timescale/timescaledb:latest-pg14
        
        # ตั้งค่ารหัสผ่าน Database (ในงานจริงควรใช้ Secret)
        env:
        - name: POSTGRES_PASSWORD
          value: "password" # <--- รหัสผ่าน DB
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "iiot_data"
        
        ports:
        - containerPort: 5432
          hostPort: 5432 # เปิด Port 5432 บนเครื่อง Edge
          protocol: TCP
          
        # เก็บข้อมูลลง Harddisk
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data

      volumes:
      - name: db-data
        hostPath:
          # ⭐️ สำคัญ: เก็บไฟล์ Database ลงบนเครื่อง Edge (EC2) จริงๆ
          # เพื่อให้ข้อมูลยังอยู่แม้จะลบ Pod หรือ Restart เครื่อง
          path: /var/lib/edge-db-data
          type: DirectoryOrCreate