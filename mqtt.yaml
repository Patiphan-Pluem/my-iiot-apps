# -----------------------------------------------------------------
# ส่วนที่ 1: ConfigMap (การตั้งค่าของ MQTT)
# -----------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
  namespace: default
data:
  # สร้างไฟล์ config ให้ Mosquitto 2.0 ยอมรับการเชื่อมต่อจากภายนอก
  mosquitto.conf: |
    persistence false
    log_dest stdout
    listener 1883
    allow_anonymous true

---
# -----------------------------------------------------------------
# ส่วนที่ 2: DaemonSet (ตัวโปรแกรม MQTT)
# -----------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mqtt-edge-broker
  namespace: default
spec:
  selector:
    matchLabels:
      app: mqtt-broker
  template:
    metadata:
      labels:
        app: mqtt-broker
    spec:
      # ⭐️ กุญแจสำคัญ: บังคับให้รันเฉพาะบน Node ที่มีป้าย "edge"
      nodeSelector:
        node-type: edge
      
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        
        # เปิด Port 1883 ให้เครื่องอื่นในวง LAN เชื่อมต่อได้
        ports:
        - containerPort: 1883
          hostPort: 1883
          protocol: TCP
        
        # โหลดไฟล์ Config จาก ConfigMap ด้านบนมาใช้
        volumeMounts:
        - name: mosquitto-config-vol
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf

      volumes:
      - name: mosquitto-config-vol
        configMap:
          name: mqtt-config